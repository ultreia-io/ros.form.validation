name: Website
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: r-lib/actions/setup-r@v2.12.1
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2.12.1
      - uses: r-lib/actions/setup-r-dependencies@v2.12.1
        with:
          packages: deps::.
          extra-packages: |
            any::rcmdcheck
            any::roxygen2
          needs: website
      - name: Generate package documentation
        shell: Rscript {0}
        run: roxygen2::roxygenise()

      - run: Rscript tools/check.R
      - run: Rscript tools/build-site.R
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
